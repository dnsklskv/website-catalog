<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Website Catalog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap">
<style>
/* Layout: sticky filter panel (3 labelled chip rows) over a 4-column reference grid */
:root{
  --bg:#ffffff;
  --panel:#efefef;
  --fg:#1c1c1c;
  --muted:#6b6b6b;
  --line:#c9c9c9;
  --chip-on-bg:#111111;
  --chip-on-fg:#ffffff;
  --thumb:#8a8a8a;
  --hl:#111111;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141414;--panel:#1f1f1f;--fg:#ececec;--muted:#9a9a9a;--line:#3d3d3d;
  --chip-on-bg:#f2f2f2;--chip-on-fg:#111111;--thumb:#2a2a2a;--hl:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141414;--panel:#1f1f1f;--fg:#ececec;--muted:#9a9a9a;--line:#3d3d3d;
  --chip-on-bg:#f2f2f2;--chip-on-fg:#111111;--thumb:#2a2a2a;--hl:#ffffff;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}

.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);
  padding-block:22px 22px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}
.frow{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:12px}
.frow+.frow{margin-top:10px}
.flabel{font-size:15px;color:var(--fg);opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{appearance:none;font:inherit;font-size:15.5px;line-height:1;color:var(--fg);background:transparent;
  border:1px solid var(--line);border-radius:999px;padding:11px 18px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s}
.chip:hover{border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--chip-on-bg);color:var(--chip-on-fg);border-color:var(--chip-on-bg)}
.chip:focus-visible,.clear:focus-visible,.card:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.5;margin-left:6px;font-variant-numeric:tabular-nums}
.chip[disabled]{opacity:.35;cursor:default}
.chip[disabled]:hover{border-color:var(--line)}
.trow{display:flex;align-items:center;gap:16px;justify-content:space-between}
.clear{appearance:none;font:inherit;font-size:15.5px;color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:999px;padding:11px 18px;cursor:pointer;white-space:nowrap;flex:none}
.clear:hover{border-color:var(--fg)}
.clear[disabled]{opacity:.35;cursor:default}

main{padding-block:28px 64px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.02em;margin:0 0 20px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:38px;row-gap:38px}
.card{display:block;color:inherit;text-decoration:none;min-width:0}
.thumb{position:relative;aspect-ratio:1228/668;max-width:100%;background:var(--thumb);overflow:hidden}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover .thumb img,.card:hover .thumb video{transform:scale(1.03)}
.badge{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(0,0,0,.55);color:#fff;padding:4px 7px;border-radius:3px;backdrop-filter:blur(4px)}
.open{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:#fff;color:#111;
  display:grid;place-items:center;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s}
.card:hover .open,.card:focus-visible .open{opacity:1;transform:none}
.meta{padding-top:12px}
.name{font-weight:600;font-size:17px;line-height:1.25;margin:0;display:flex;gap:8px;align-items:baseline;min-width:0}
.name>span:first-child{flex:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.domain{min-width:0}
.domain{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:3px 9px;margin-top:5px;font-size:13px;color:var(--muted)}
.tags .on{color:var(--hl);text-decoration:underline;text-underline-offset:3px}
.empty{padding:80px 0;text-align:center;color:var(--muted)}
.empty button{margin-top:16px}

@media (max-width:1200px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:28px}}
@media (max-width:860px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px;row-gap:28px}
  .filters,main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .frow{grid-template-columns:minmax(0,1fr);gap:6px}
  .flabel{font-size:12px;text-transform:uppercase;letter-spacing:.08em}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-right:16px}
  .chips::-webkit-scrollbar{display:none}
  .chip,.clear{font-size:14px;padding:9px 14px}
  .filters{position:static}
  .trow{flex-direction:column;align-items:stretch;gap:10px}
  .clear{align-self:flex-start}
}
@media (max-width:520px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.thumb img,.thumb video,.open,.chip{transition:none}}
</style>

</head>
<body>
<section class="filters" aria-label="Filters">
  <div class="frow"><div class="flabel" id="l-industry">Industry</div><div class="chips" role="group" aria-labelledby="l-industry" data-group="industry"></div></div>
  <div class="frow"><div class="flabel" id="l-style">Style</div><div class="chips" role="group" aria-labelledby="l-style" data-group="style"></div></div>
  <div class="frow"><div class="flabel" id="l-type">Type</div>
    <div class="trow"><div class="chips" role="group" aria-labelledby="l-type" data-group="type"></div>
    <button class="clear" id="clear" type="button">Clear all filters</button></div></div>
</section>

<main>
  <p class="status" id="status" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <div>No sites match all selected filters.</div>
    <button class="clear" id="clear2" type="button">Clear all filters</button>
  </div>
</main>

<script>
const TAGS = {
  industry: ["Marketing","Crypto/Web3","Technology","Corporate","Finance","Health and Beauty","Real Estate and Architecture","Milltech and Defence tech","Cyber security","eCommers","AI"],
  style: ["Elegant","Minimalistic","3D","Bright colors","Illustration","Dark Colors","Light Colors","Futuristic","Bold","Clean","Fun","Playfull"],
  type: ["SaaS","Product","Software","Service","Hardware","Business"]
};
// id → media/<id>.jpg (+ media/<id>.mp4 when v:1)
const SITES = [
 {id:"odysseeclinic",name:"Odyssée Clinic",url:"https://www.odysseeclinic.com.au/",t:["Health and Beauty","Elegant","Minimalistic"]},
 {id:"usavionix",name:"US Avionix",url:"https://www.usavionix.com/",v:1,t:["Milltech and Defence tech","Technology","Hardware","3D"]},
 {id:"primland",name:"Primland",url:"https://explore.ownprimland.com/",v:1,t:["Real Estate and Architecture","3D","Elegant"]},
 {id:"terminal-industries",name:"Terminal Industries",url:"https://terminal-industries.com/",v:1,t:["Technology","3D"]},
 {id:"truekind",name:"True Kind Skincare",url:"https://truekindskincare.com/",v:1,t:["Health and Beauty","eCommers","Elegant","Minimalistic"]},
 {id:"impact-drones",name:"Impact Drones",url:"https://www.impact-drones.com/",t:["Milltech and Defence tech","Technology","Hardware","3D"]},
 {id:"quadplex80",name:"Quadplex 80",url:"https://quadplex80.com/",v:1,t:["Real Estate and Architecture","3D","Elegant","Light Colors"]},
 {id:"composites",name:"Composites Archi",url:"https://www.composites.archi/",v:1,t:["Technology","3D","Futuristic","Dark Colors"]},
 {id:"hematogenix",name:"Hematogenix",url:"https://www.hematogenix.com/",v:1,t:["Health and Beauty","eCommers","Minimalistic","Futuristic"]},
 {id:"anduril",name:"Anduril Roadrunner",url:"https://www.anduril.com/roadrunner",t:["Milltech and Defence tech","Technology","Hardware","3D","Dark Colors"]},
 {id:"heronai",name:"Heron AI",url:"https://heronaiapp.com/",t:["Real Estate and Architecture","Illustration","Elegant","Light Colors","SaaS"]},
 {id:"magicwindow",name:"Magic Window",url:"https://magicwindow.io/",v:1,t:["Technology","3D","Light Colors"]},
 {id:"katkin",name:"KatKin",url:"https://www.katkin.com/",t:["eCommers","Bold","Illustration","Fun","Playfull"]},
 {id:"sr-seventy",name:"SR-Seventy",url:"https://www.sr-seventy.one/",v:1,t:["Milltech and Defence tech","Technology","Hardware","3D","Dark Colors"]},
 {id:"intercom",name:"Intercom",url:"https://www.intercom.com/",t:["Marketing","AI","Software","SaaS","Clean"]},
 {id:"wrk",name:"WRK Timepieces",url:"https://www.wrk-timepieces.com/",v:1,t:["Technology","eCommers","3D","Minimalistic","Hardware"]},
 {id:"cobfoods",name:"Cob Foods",url:"https://cobfoods.com/",t:["eCommers","Bold","Illustration","Fun","Playfull"]},
 {id:"amaterasu",name:"Amaterasu",url:"https://amaterasu.ai/",t:["Health and Beauty","Technology","SaaS","Software","Minimalistic"]},
 {id:"letters",name:"Letters",url:"https://letters.app/",t:["AI","Software","SaaS","Clean"]},
 {id:"vectrfl",name:"Vectrfl",url:"https://www.vectrfl.com/",v:1,t:["Technology","AI","3D","SaaS","Light Colors"]},
 {id:"monpetitplacement",name:"Mon Petit Placement",url:"https://www.monpetitplacement.fr/",t:["Finance","SaaS","Software","Playfull"]},
 {id:"weaveos",name:"Weave",url:"https://weaveos.com/",v:1,t:["SaaS","Software","Clean","Playfull"]},
 {id:"hims",name:"Hims",url:"https://www.hims.com/",t:["Health and Beauty","Software","Product","Clean"]},
 {id:"alethia",name:"Alethia",url:"https://www.alethia.earth/",v:1,t:["Technology","AI","3D","SaaS"]},
 {id:"seed",name:"Seed",url:"https://seed.com/",t:["eCommers","Health and Beauty","Clean","Elegant","Product"]},
 {id:"keytail",name:"Keytail",url:"https://www.keytail.ai/",v:1,t:["SaaS","Software","Clean","Minimalistic"]},
 {id:"superpower",name:"Superpower",url:"https://superpower.com/",t:["Software","SaaS","Service"]},
 {id:"joby",name:"Joby Aviation",url:"https://www.jobyaviation.com/",v:1,t:["Technology","3D","Business","Futuristic"]},
 {id:"ayocin",name:"Ayocin",url:"https://ayocin.com/",t:["eCommers","Health and Beauty","Clean","Elegant","Product"]},
 {id:"intrepid",name:"Intrepid Automation",url:"https://www.intrepidautomation.com/",v:1,t:["Technology","3D","Hardware"]},
 {id:"eladiodieste",name:"Eladio Dieste",url:"https://www.eladiodieste.com/",t:["Real Estate and Architecture","Service","Elegant","Clean"]},
 {id:"meter",name:"Meter",url:"https://www.meter.com/",v:1,t:["Technology","3D","Hardware","Light Colors"]},
 {id:"lobbspadel",name:"Lobb's Padel",url:"https://www.lobbspadel.com/",t:["Illustration","Fun","Playfull"]},
 {id:"adyen",name:"Adyen",url:"https://www.adyen.com/",t:["Finance","Corporate","Clean","Bold","Business","Service"]},
 {id:"ramp",name:"Ramp",url:"https://ramp.com/",t:["Finance","SaaS","Software"]},
 {id:"amd-group",name:"AMD Group",url:"https://amd-group.netlify.app/",t:["Marketing","Corporate","Bold","Elegant","Service","Business"]},
 {id:"vastspace",name:"Vast",url:"https://www.vastspace.com/",t:["Technology","3D","Service","Hardware","Clean"]},
 {id:"mercury",name:"Mercury",url:"https://mercury.com/",t:["Finance","Technology","Elegant","Clean","SaaS","Service"]},
 {id:"revolut",name:"Revolut",url:"https://www.revolut.com/",t:["Finance","SaaS","Software"]},
 {id:"bevel",name:"Bevel",url:"https://www.bevel.health/",t:["Health and Beauty","AI","Clean","Elegant","Product","Software"]},
 {id:"hyperframe",name:"Hyperframe",url:"https://www.hyperframe.com/",t:["Technology","3D","Service","Dark Colors"]},
 {id:"shiftrobotics",name:"Shift Robotics",url:"https://shiftrobotics.io/",t:["Technology","eCommers","Dark Colors","Futuristic","Bold","Hardware"]},
 {id:"angellist",name:"AngelList",url:"https://www.angellist.com/",t:["Finance","SaaS","Software","AI","Clean"]},
 {id:"onramper",name:"Onramper",url:"https://onramper.com/",t:["Crypto/Web3","Finance","3D","Bright colors","Futuristic","SaaS"]},
 {id:"rivian",name:"Rivian",url:"https://rivian.com/",t:["Technology","Product","Minimalistic","Clean"]},
 {id:"fruitful",name:"Fruitful",url:"https://www.fruitful.com/",t:["Finance","Illustration","Light Colors","Playfull","Service","Product"]},
 {id:"jeton",name:"Jeton",url:"https://www.jeton.com/",t:["Finance","SaaS","Software","Clean"]},
 {id:"tadesign",name:"TA Design",url:"https://www.tadesign.nl/",t:["Real Estate and Architecture","Elegant","Minimalistic","Light Colors","Service"]},
 {id:"immersive-g",name:"Immersive Garden",url:"https://immersive-g.com/",v:1,t:["3D","Minimalistic","Elegant","Illustration"]},
 {id:"igloo",name:"Igloo Inc.",url:"https://www.igloo.inc/",v:1,t:["Crypto/Web3","3D","Minimalistic"]},
 {id:"champions4good",name:"Champions for Good",url:"https://www.champions4good.club/",v:1,t:["Bold","Business","Illustration"]},
 {id:"lightship",name:"Lightship",url:"https://www.lightshiprv.com/",t:["Technology","Product","Clean"]},
 {id:"nuraform",name:"Nuraform",url:"https://www.nuraform.com/",t:["SaaS","AI"]},
 {id:"moxion",name:"Moxion Power",url:"https://moxion-preprod.rejouice.io/",v:1,t:["Technology","3D","Hardware","eCommers"]},
 {id:"merus",name:"Merus",url:"https://www.merus1894.com/",t:["Real Estate and Architecture","Corporate","Bold","Clean","Service","Business"]},
 {id:"sharplink",name:"SharpLink",url:"https://www.sharplink.com/",t:["Finance","Software","Technology"]},
 {id:"on-energy",name:"ON.energy",url:"https://www.on.energy/",v:1,t:["Technology","3D","Hardware","Business","Dark Colors"]},
 {id:"campfire",name:"Campfire",url:"https://campfire.ai/",t:["Finance","AI","Clean","Light Colors","SaaS","Software"]},
 {id:"gkc",name:"GKC",url:"https://gkc.ca/en",t:["Real Estate and Architecture","Illustration","Corporate"]},
 {id:"attio",name:"Attio",url:"https://attio.com/",t:["AI","Technology","Clean","Minimalistic","Light Colors","SaaS"]},
 {id:"zerohash",name:"Zero Hash",url:"https://zerohash.com/",t:["Finance","Crypto/Web3","Illustration","SaaS","Software"]},
 {id:"onspecdaq",name:"OnSpec",url:"https://onspecdaq.com/",t:["Technology","Corporate","Dark Colors","Bold","Hardware","Service"]},
 {id:"evervault",name:"Evervault",url:"https://evervault.com/",t:["Finance","Cyber security","Technology","Dark Colors","Clean","SaaS","Software"]},
 {id:"upguard",name:"UpGuard",url:"https://www.upguard.com/",t:["Cyber security","AI","Dark Colors","Minimalistic","SaaS","Software"]}
];

const GROUP_OF = {};
for (const g in TAGS) TAGS[g].forEach(x => GROUP_OF[x] = g);
const ORDER = [...TAGS.type, ...TAGS.style, ...TAGS.industry];
const sel = {industry:new Set(), style:new Set(), type:new Set()};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const host = u => u.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,"");

// restore remembered filters
try { const s = JSON.parse(localStorage.getItem("wc-filters")||"{}"); for (const g in sel) (s[g]||[]).forEach(x => TAGS[g].includes(x) && sel[g].add(x)); } catch(e){}
function save(){ try{ localStorage.setItem("wc-filters", JSON.stringify(Object.fromEntries(Object.entries(sel).map(([g,s])=>[g,[...s]])))); }catch(e){} }

// match: OR inside a group, AND across groups
function matches(site, s = sel){
  for (const g in s) { if (s[g].size && !site.t.some(x => s[g].has(x))) return false; }
  return true;
}

// chips
for (const g in TAGS) {
  const box = document.querySelector(`[data-group="${g}"]`);
  TAGS[g].forEach(tag => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.dataset.tag = tag; b.dataset.group = g;
    b.innerHTML = `${tag}<span class="n"></span>`;
    b.addEventListener("click", () => { sel[g].has(tag) ? sel[g].delete(tag) : sel[g].add(tag); update(); });
    box.appendChild(b);
  });
}

// cards
const grid = document.getElementById("grid");
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  const v = e.target;
  if (e.isIntersecting) { if (!v.src) v.src = v.dataset.src; v.play().catch(()=>{}); } else v.pause();
}), {rootMargin:"200px 0px"}) : null;

const cards = SITES.map(s => {
  s.t.sort((a,b) => ORDER.indexOf(a) - ORDER.indexOf(b));
  const a = document.createElement("a");
  a.className = "card"; a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.setAttribute("aria-label", `${s.name}, opens ${host(s.url)} in a new tab`);
  const media = s.v && !reduce
    ? `<video muted loop playsinline preload="none" poster="media/${s.id}.jpg" data-src="media/${s.id}.mp4" aria-hidden="true"></video>`
    : `<img src="media/${s.id}.jpg" alt="" loading="lazy" decoding="async">`;
  a.innerHTML = `<div class="thumb">${media}${s.v?'<span class="badge">Video</span>':''}
      <span class="open" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 9L9 3M4 3h5v5" stroke="currentColor" stroke-width="1.4"/></svg></span></div>
    <div class="meta"><p class="name"><span>${s.name}</span><span class="domain">${host(s.url)}</span></p>
    <div class="tags">${s.t.map(x=>`<span data-tag="${x}">${x}</span>`).join("")}</div></div>`;
  grid.appendChild(a);
  const v = a.querySelector("video");
  if (v) v.addEventListener("error", () => { const img = new Image(); img.src = `media/${s.id}.jpg`; img.alt = ""; io && io.unobserve(v); v.replaceWith(img); }, true);
  if (v && io) io.observe(v); else if (v) { v.src = v.dataset.src; v.play().catch(()=>{}); }
  return {s, el:a};
});

function update(){
  let shown = 0;
  cards.forEach(({s, el}) => {
    const ok = matches(s); el.hidden = !ok; if (ok) shown++;
    el.querySelectorAll(".tags span").forEach(t => t.classList.toggle("on", sel[GROUP_OF[t.dataset.tag]]?.has(t.dataset.tag)));
  });
  // facet counts: how many sites you'd see if this chip were also on
  document.querySelectorAll(".chip").forEach(b => {
    const g = b.dataset.group, tag = b.dataset.tag, on = sel[g].has(tag);
    b.setAttribute("aria-pressed", on);
    const trial = {...sel, [g]: new Set(on ? sel[g] : [...sel[g], tag])};
    if (!on && sel[g].size === 0) trial[g] = new Set([tag]);
    const n = SITES.filter(s => matches(s, trial) && s.t.includes(tag)).length;
    b.querySelector(".n").textContent = n;
    b.disabled = !on && n === 0;
  });
  const any = Object.values(sel).some(s => s.size);
  document.getElementById("clear").disabled = !any;
  document.getElementById("empty").hidden = shown > 0;
  document.getElementById("status").textContent = any ? `${shown} of ${SITES.length} sites` : `${SITES.length} sites`;
  save();
}
const clearAll = () => { Object.values(sel).forEach(s => s.clear()); update(); };
document.getElementById("clear").addEventListener("click", clearAll);
document.getElementById("clear2").addEventListener("click", clearAll);
update();
</script>
</body>
</html>
